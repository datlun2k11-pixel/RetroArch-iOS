name: Build RetroArch iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Fetch iOS Cores
        run: |
          chmod +x pkg/apple/fetch_cores.sh
          ./pkg/apple/fetch_cores.sh ios-arm64

      - name: Build Xcode Archive
        run: |
          xcodebuild archive \
            -project pkg/apple/RetroArch_iOS13.xcodeproj \
            -scheme "RetroArch iOS" \
            -sdk iphoneos \
            -archivePath build/RetroArch.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/RetroArch.xcarchive/Products/Applications/RetroArch.app build/Payload/
          cd build
          zip -r RetroArch.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroArch-Unsigned-IPA
          path: build/RetroArch.ipa
